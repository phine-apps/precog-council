[project]
name = "precog-council"
version = "0.1.0"
description = "Multi-model arbitration engine and CLI that isolates minority dissent to expose fatal blind spots"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "phine-apps" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[project.scripts]
precog = "precog_council.cli:main"
precog-council = "precog_council.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.2.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
