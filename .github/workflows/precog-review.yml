name: Precog Council PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  precog-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extract PR Git Diff
        run: |
          # Capture diff and cap at 2000 lines to prevent token exhaustion / OOM
          git diff origin/${{ github.base_ref }}...HEAD | head -n 2000 > pr_diff.txt

      - name: Check Available API Keys
        id: check_keys
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_KEY" ] || [ -n "$GEMINI_KEY" ] || [ -n "$OPENAI_KEY" ]; then
            echo "has_keys=true" >> $GITHUB_OUTPUT
          else
            echo "has_keys=false" >> $GITHUB_OUTPUT
            echo "No LLM API keys provided (likely a fork PR). Skipping Precog Council arbitration."
          fi

      - name: Run Precog Council Review
        if: steps.check_keys.outputs.has_keys == 'true'
        id: precog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uvx precog-council "PR #${PR_NUMBER}: ${PR_TITLE}" \
            --file pr_diff.txt \
            --domain code \
            --format markdown > precog_report.md

      - name: Post Precog Report to PR
        if: steps.check_keys.outputs.has_keys == 'true' && hashFiles('precog_report.md') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('precog_report.md', 'utf8');
            
            // Check existing comments to update or post new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body.includes('🏛️ Precog Council Evaluation Report'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
